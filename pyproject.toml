[project]
name = "paperrag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Hirak Chatterjee", email = "hirakchatterjee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.1.0",
    "docling>=2.151.1",
    "gradio>=6.32.0",
    "lancedb>=0.41.0",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "sentence-transformers>=6.3.0",
    "tantivy>=0.27.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
paperrag = "paperrag.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
